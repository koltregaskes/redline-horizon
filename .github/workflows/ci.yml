# Checks only. This workflow never deploys or publishes anything:
# GitHub Pages deploys stay in deploy.yml, which runs on push to main only.
name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Install, typecheck, build, test, headless boot
    # Pinned: Playwright 1.59 has no browser build for ubuntu-latest (26.04) yet.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      - name: Simulation smoke test
        run: npm run smoke:simulation
      - name: Install headless Chromium
        run: npx playwright install --with-deps --only-shell chromium
      - name: Headless boot smoke (fails on console or page errors)
        run: node scripts/ci-smoke.mjs dist --selector=canvas
